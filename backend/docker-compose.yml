services:
  postgres:
    image: postgres:17-alpine
    container_name: synthora-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-synthora_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-synthora_password}
      POSTGRES_DB: ${DB_NAME:-synthora}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - synthora-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: synthora-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@synthora.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - synthora-network

volumes:
  postgres_data:

networks:
  synthora-network:
    driver: bridge
