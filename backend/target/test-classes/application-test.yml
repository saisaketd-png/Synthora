spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;INIT=CREATE SEQUENCE IF NOT EXISTS purchase_order_seq START WITH 1 INCREMENT BY 1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update

  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET:SynthoraDevSecretKeyForJwtSigning2026!}
  expiration: 86400000

synthora:
  storage:
    local:
      root: ./target/test-storage
  documents:
    max-file-size: 10485760
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: notifications@kemkendra.com
    from-name: KemKendra Chemical Marketplace
  app:
    base-url: http://localhost:3000
  rate-limit:
    enabled: false

spring.servlet.multipart.max-file-size: 50MB
spring.servlet.multipart.max-request-size: 50MB