spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: synthora

  datasource:
    url: jdbc:postgresql://localhost:5433/synthora
    username: synthora_admin
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:false}
            required: ${SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8085}
  max-http-request-header-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

synthora:
  storage:
    local:
      root: ./storage/documents
  documents:
    max-file-size: 10485760
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:notifications@synthora.com}
    from-name: ${MAIL_FROM_NAME:Synthora B2B Marketplace}
  app:
    base-url: ${APP_BASE_URL:http://localhost:3000}

spring.servlet.multipart.max-file-size: 50MB
spring.servlet.multipart.max-request-size: 50MB