spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: KemKendraHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: INFO
    com.kemkendra: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    org.springframework.web: INFO
    org.springframework.security: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

kemkendra:
  storage:
    local:
      root: ${STORAGE_ROOT:/app/storage}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${APP_BASE_URL}}
  app:
    base-url: ${APP_BASE_URL}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login:
      limit: ${RATE_LIMIT_LOGIN:10}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW:60}
    refresh:
      limit: ${RATE_LIMIT_REFRESH:20}
      window-seconds: ${RATE_LIMIT_REFRESH_WINDOW:60}
    registration:
      limit: ${RATE_LIMIT_REGISTRATION:10}
      window-seconds: ${RATE_LIMIT_REGISTRATION_WINDOW:60}
    password-reset:
      limit: ${RATE_LIMIT_PASSWORD_RESET:10}
      window-seconds: ${RATE_LIMIT_PASSWORD_RESET_WINDOW:60}
    email-verification:
      limit: ${RATE_LIMIT_EMAIL_VERIFICATION:15}
      window-seconds: ${RATE_LIMIT_EMAIL_VERIFICATION_WINDOW:60}
    public-api:
      limit: ${RATE_LIMIT_PUBLIC_API:120}
      window-seconds: ${RATE_LIMIT_PUBLIC_API_WINDOW:60}
