spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: kemkendra

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/kemkendra}
    username: ${DB_USER:kemkendra_admin}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
            required: ${SMTP_STARTTLS_REQUIRED:true}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT:10000}
          timeout: ${SMTP_TIMEOUT:10000}
          writetimeout: ${SMTP_WRITE_TIMEOUT:10000}

server:
  port: ${PORT:8085}
  max-http-request-header-size: 16KB
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

kemkendra:
  storage:
    local:
      root: ./storage/documents
  documents:
    max-file-size: 10485760
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${APP_BASE_URL:http://localhost:3000}}
  security:
    cookie:
      secure: ${COOKIE_SECURE:false}
      same-site: Strict
      path: /
      max-age: 604800s
    csrf:
      enabled: ${CSRF_ENABLED:true}
      enforce: ${CSRF_ENFORCE:true}
      secure: ${CSRF_COOKIE_SECURE:false}
      same-site: Strict
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:${SMTP_USERNAME:notifications@kemkendra.com}}
    from-name: ${MAIL_FROM_NAME:KemKendra Chemical Marketplace}
  app:
    base-url: ${APP_BASE_URL:http://localhost:3000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login:
      limit: ${RATE_LIMIT_LOGIN:10}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW:60}
    refresh:
      limit: ${RATE_LIMIT_REFRESH:20}
      window-seconds: ${RATE_LIMIT_REFRESH_WINDOW:60}
    registration:
      limit: ${RATE_LIMIT_REGISTRATION:10}
      window-seconds: ${RATE_LIMIT_REGISTRATION_WINDOW:60}
    password-reset:
      limit: ${RATE_LIMIT_PASSWORD_RESET:10}
      window-seconds: ${RATE_LIMIT_PASSWORD_RESET_WINDOW:60}
    email-verification:
      limit: ${RATE_LIMIT_EMAIL_VERIFICATION:15}
      window-seconds: ${RATE_LIMIT_EMAIL_VERIFICATION_WINDOW:60}
    public-api:
      limit: ${RATE_LIMIT_PUBLIC_API:120}
      window-seconds: ${RATE_LIMIT_PUBLIC_API_WINDOW:60}

spring.servlet.multipart.max-file-size: 50MB
spring.servlet.multipart.max-request-size: 50MB