services:

  postgres:
    image: postgres:16-alpine
    container_name: kemkendra-prod-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kemkendra}
      POSTGRES_USER: ${POSTGRES_USER:-kemkendra_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - kemkendra-prod-pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-kemkendra_admin} -d ${POSTGRES_DB:-kemkendra}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend

    container_name: kemkendra-prod-backend
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms96m -Xmx256m -XX:+ExitOnOutOfMemoryError}

      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kemkendra}}
      DB_USER: ${DB_USER:-${POSTGRES_USER:-kemkendra_admin}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD}}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}

      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-false}
      SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-false}
      MAIL_FROM: ${MAIL_FROM:-notifications@kemkendra.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-KemKendra Chemical Marketplace}

      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

    volumes:
      - kemkendra-prod-documents:/app/storage

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8085/actuator/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s


  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend

    container_name: kemkendra-prod-frontend
    restart: unless-stopped

    environment:
      HOSTNAME: "0.0.0.0"
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8085}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8085}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s


  nginx:
    image: nginx:alpine
    container_name: kemkendra-prod-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s


volumes:
  kemkendra-prod-pgdata:
  kemkendra-prod-documents: