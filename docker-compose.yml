services:

  postgres:
    image: postgres:16-alpine
    container_name: synthora-prod-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synthora}
      POSTGRES_USER: ${POSTGRES_USER:-synthora_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5435:5432"

    volumes:
      - synthora-prod-pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-synthora_admin} -d ${POSTGRES_DB:-synthora}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend

    container_name: synthora-prod-backend
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-synthora}
      DB_USER: ${POSTGRES_USER:-synthora_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"

      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@synthora.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-adminpassword}

    ports:
      - "8085:8085"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8085/actuator/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s


  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend

    container_name: synthora-prod-frontend
    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}

    ports:
      - "3000:3000"

    depends_on:
      backend:
        condition: service_healthy


  nginx:
    image: nginx:alpine
    container_name: synthora-prod-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started


volumes:
  synthora-prod-pgdata: